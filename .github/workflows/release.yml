name: Release Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify toolchain and Docker
        run: |
          java -version
          mvn -version
          docker version

      - name: Install XML report reader
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      - name: Run full release reactor
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Start pinned Nacos 3 deployment
        run: |
          docker run -d --name yunqi-nacos --network host \
            -e MODE=standalone \
            -e NACOS_AUTH_ENABLE=false \
            -e NACOS_AUTH_TOKEN=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE= \
            -e NACOS_AUTH_IDENTITY_KEY=steward-ci \
            -e NACOS_AUTH_IDENTITY_VALUE=steward-ci \
            nacos/nacos-server:v3.1.1
          for attempt in $(seq 1 90); do
            if curl --fail --silent \
                http://127.0.0.1:8080/v3/console/health/readiness; then
              exit 0
            fi
            sleep 2
          done
          docker logs yunqi-nacos
          exit 1

      - name: Verify real Nacos configuration source
        env:
          YUNQI_NACOS_TEST_SERVER_ADDR: 127.0.0.1:8848
        run: |
          mvn --batch-mode --no-transfer-progress \
            -pl yunqi-steward-control-plane/configuration-management/nacos/v3 \
            --also-make \
            -Dtest=Nacos3ConfigurationSourceIntegrationTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -DfailIfNoTests=false test

      - name: Require all Docker tests with zero skips
        run: scripts/assert-docker-tests.sh

      - name: Capture remaining container diagnostics
        if: failure()
        run: |
          docker ps -a
          for container in $(docker ps -aq); do
            echo "===== docker logs: $container ====="
            docker logs "$container" || true
          done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: error

      - name: Clean Docker resources
        if: always()
        run: |
          docker ps -aq | xargs -r docker rm -f
          docker network prune -f

  binary-compatibility:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PACKAGES_USERNAME: ${{ secrets.PACKAGES_USERNAME }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21 and GitHub Packages credentials
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: PACKAGES_USERNAME
          server-password: PACKAGES_TOKEN

      - name: Require package-read credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PACKAGES_USERNAME" && -n "$PACKAGES_TOKEN" ]] || {
            echo "PACKAGES_USERNAME and PACKAGES_TOKEN are required for the binary baseline" >&2
            exit 1
          }

      - name: Run strict binary compatibility gate
        run: mvn --batch-mode --no-transfer-progress -Pbaseline-compatibility clean verify
